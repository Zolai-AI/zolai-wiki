name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zvs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZVS 2018 forbidden form check (advisory)
        run: |
          echo "=== ZVS 2018 Forbidden Form Check (advisory) ==="
          # Short tokens cu/cun/ram collide with English; docs/ teach legacy→ZVS maps.
          # Report only — content migration is tracked separately.
          FORBIDDEN_WORDS="pathian fapa bawipa siangpahrang"
          FOUND=0
          for word in $FORBIDDEN_WORDS; do
            MATCHES=$(grep -rli --include='*.md' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=archive --exclude-dir=docs --exclude=README.md "\b${word}\b" . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "NOTE: '${word}' still appears in:"
              echo "$MATCHES" | head -20
              FOUND=$((FOUND + 1))
            fi
          done
          echo "Advisory summary: $FOUND form cluster(s) still present in legacy content."
          exit 0

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          echo "=== Markdown Lint Check ==="
          # Lint all markdown files, ignore node_modules and archive
          # Full-tree vocab dumps are noisy; gate on editorial docs + grammar
          markdownlint --config .markdownlint.json             'README.md' 'docs/**/*.md' 'grammar/**/*.md' 'AGENTS.md'             --ignore 'node_modules' --ignore 'archive' --ignore '.git' || {
            echo "WARN: Markdown lint issues found (non-blocking on bulk wiki content)."
            exit 0
          }
          echo "PASSED: All markdown files pass lint."

  markdown-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate markdown syntax
        run: |
          echo "=== Markdown Syntax Validation ==="
          ERRORS=0

          # Check for broken headers (empty headers)
          echo "Checking for empty headers..."
          EMPTY_HEADERS=$(grep -rn "^#\+\s*$" --include="*.md" . 2>/dev/null || true)
          if [ -n "$EMPTY_HEADERS" ]; then
            echo "Empty headers found:"
            echo "$EMPTY_HEADERS"
            ERRORS=$((ERRORS + 1))
          fi

          # Check for broken code blocks (unclosed)
          echo "Checking for unclosed code blocks..."
          for file in $(find . -name "*.md" -not -path "./.git/*" -not -path "./archive/*"); do
            OPEN=$(grep -c '```' "$file" 2>/dev/null || echo "0")
            if [ $((OPEN % 2)) -ne 0 ]; then
              echo "Unclosed code block in: $file"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Check for duplicate headers in same file
          echo "Checking for duplicate headers..."
          for file in $(find . -name "*.md" -not -path "./.git/*" -not -path "./archive/*" -type f); do
            DUPS=$(grep -h "^#" "$file" 2>/dev/null | sort | uniq -d)
            if [ -n "$DUPS" ]; then
              echo "Duplicate headers in $file:"
              echo "$DUPS"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "WARN: $ERRORS syntax issue(s) found (non-blocking)."
            exit 0
          fi

          echo "PASSED: Markdown syntax is valid."
