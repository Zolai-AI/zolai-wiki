name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zvs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ZVS 2018 forbidden form check
        run: |
          echo "=== ZVS 2018 Forbidden Form Check ==="
          # Short tokens cu/cun/ram collide with English (curriculum, RAM, etc.).
          # Orthography guides intentionally mention legacy→ZVS mappings — exclude them.
          FORBIDDEN_WORDS=("pathian" "fapa" "bawipa" "siangpahrang")
          FOUND=0
          EXCLUDES=(
            --exclude-dir=.git
            --exclude-dir=node_modules
            --exclude-dir=archive
            --exclude=README.md
            --exclude-dir=docs
          )

          for word in "${FORBIDDEN_WORDS[@]}"; do
            MATCHES=$(grep -rli "\b${word}\b" --include="*.md" "${EXCLUDES[@]}" . 2>/dev/null || true)
            # Allow lines that only document the mapping (contain → or "forbidden")
            FILTERED=""
            if [ -n "$MATCHES" ]; then
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                if grep -ni "\b${word}\b" "$f" | grep -viE '(→|->|forbidden|legacy|ZVS 2018|orthograph)' >/dev/null; then
                  FILTERED="${FILTERED}${f}"$'
'
                fi
              done <<< "$MATCHES"
            fi
            if [ -n "$FILTERED" ]; then
              echo "VIOLATION: Found forbidden form '${word}' (non-meta usage) in:"
              echo "$FILTERED"
              FOUND=$((FOUND + 1))
            fi
          done

          if [ "$FOUND" -gt 0 ]; then
            echo ""
            echo "WARN: $FOUND forbidden form cluster(s) still present in legacy analyses/vocab."
            echo "See ZVS 2018: pathian→pasian, ram→gam, fapa→tapa, bawipa→topa, siangpahrang→kumpipa, cu/cun→tua"
            echo "Non-blocking until content migration completes; docs/ guides remain the orthography SoT."
            exit 0
          fi

          echo "PASSED: No ZVS 2018 forbidden forms found (content scan)."

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          echo "=== Markdown Lint Check ==="
          # Lint all markdown files, ignore node_modules and archive
          # Full-tree vocab dumps are noisy; gate on editorial docs + grammar
          markdownlint --config .markdownlint.json             'README.md' 'docs/**/*.md' 'grammar/**/*.md' 'AGENTS.md'             --ignore 'node_modules' --ignore 'archive' --ignore '.git' || {
            echo "WARN: Markdown lint issues found (non-blocking on bulk wiki content)."
            exit 0
          }
          echo "PASSED: All markdown files pass lint."

  markdown-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate markdown syntax
        run: |
          echo "=== Markdown Syntax Validation ==="
          ERRORS=0

          # Check for broken headers (empty headers)
          echo "Checking for empty headers..."
          EMPTY_HEADERS=$(grep -rn "^#\+\s*$" --include="*.md" . 2>/dev/null || true)
          if [ -n "$EMPTY_HEADERS" ]; then
            echo "Empty headers found:"
            echo "$EMPTY_HEADERS"
            ERRORS=$((ERRORS + 1))
          fi

          # Check for broken code blocks (unclosed)
          echo "Checking for unclosed code blocks..."
          for file in $(find . -name "*.md" -not -path "./.git/*" -not -path "./archive/*"); do
            OPEN=$(grep -c '```' "$file" 2>/dev/null || echo "0")
            if [ $((OPEN % 2)) -ne 0 ]; then
              echo "Unclosed code block in: $file"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # Check for duplicate headers in same file
          echo "Checking for duplicate headers..."
          for file in $(find . -name "*.md" -not -path "./.git/*" -not -path "./archive/*" -type f); do
            DUPS=$(grep -h "^#" "$file" 2>/dev/null | sort | uniq -d)
            if [ -n "$DUPS" ]; then
              echo "Duplicate headers in $file:"
              echo "$DUPS"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "WARN: $ERRORS syntax issue(s) found (non-blocking)."
            exit 0
          fi

          echo "PASSED: Markdown syntax is valid."
